################################################
# Variable header - CHANGE ME                  #
################################################

define OWNAS       = <OWNAS>;        # e.g. 4242421234
define OWNIP       = <OWNIP>;        # e.g. 172.20.x.x
define OWNIPv6     = <OWNIPv6>;      # e.g. fdb5:32:ad4a::1
define OWNNET      = <OWNNET>;       # e.g. 172.20.x.x/27
define OWNNETv6    = <OWNNETv6>;     # e.g. fdb5:32:ad4a::/48
define OWNNETSET   = [<OWNNET>+];
define OWNNETSETv6 = [<OWNNETv6>+];

# DN42 Region Community (optional)
# 41=Europe 42=NA-E 43=NA-C 44=NA-W 45=CentralAm 46=SA-E 47=SA-W
# 48=Africa-N 49=Africa-S 50=Asia-S 51=Asia-SE 52=Asia-E 53=Pacific
define DN42_REGION = 52;

################################################
# Header end                                   #
################################################

router id OWNIP;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    ipv6;
    interface "dn42-dummy";
}

#
# Utility functions
#

function is_self_net() -> bool {
    return net ~ OWNNETSET;
}

function is_self_net_v6() -> bool {
    return net ~ OWNNETSETv6;
}

function is_valid_network() -> bool {
    return net ~ [
        172.20.0.0/14{21,29},       # dn42
        172.20.0.0/24{28,32},       # dn42 Anycast
        172.21.0.0/24{28,32},       # dn42 Anycast
        172.22.0.0/24{28,32},       # dn42 Anycast
        172.23.0.0/24{28,32},       # dn42 Anycast
        172.31.0.0/16+,             # ChaosVPN
        10.100.0.0/14+,             # ChaosVPN
        10.127.0.0/16+,             # NeoNetwork
        10.0.0.0/8{15,24}           # Freifunk
    ];
}

function is_valid_network_v6() -> bool {
    return net ~ [
        fd00::/8{44,64}             # ULA (RFC 4193)
    ];
}

#
# ROA / RPKI
#

roa4 table dn42_roa;
roa6 table dn42_roa_v6;

protocol rpki roa_dn42 {
    roa4 { table dn42_roa; };
    roa6 { table dn42_roa_v6; };
    remote "rpki.dn42.muska.zip" port 14215;
    refresh 600;
    retry 300;
    expire 7200;
}

#
# Kernel routing tables
#

protocol kernel {
    scan time 20;
    ipv4 {
        import none;
        export filter {
            if source = RTS_STATIC then reject;
            krt_prefsrc = OWNIP;
            accept;
        };
    };
}

protocol kernel {
    scan time 20;
    ipv6 {
        import none;
        export filter {
            if source = RTS_STATIC then reject;
            krt_prefsrc = OWNIPv6;
            accept;
        };
    };
}

#
# Static routes (announce our own nets)
#

protocol static {
    route OWNNET reject;
    ipv4 { import all; export none; };
}

protocol static {
    route OWNNETv6 reject;
    ipv6 { import all; export none; };
}

#
# OSPF - IGP for internal routing
#

protocol ospf v2 igp_ospf_v4 {
    ipv4 {
        import all;
        export filter {
            # NEVER export external BGP routes into OSPF!
            if net ~ OWNNETSET then accept;
            if source = RTS_STATIC then accept;
            reject;
        };
    };
    include "/etc/bird/ospf/*.conf";
}

protocol ospf v3 igp_ospf_v6 {
    ipv6 {
        import all;
        export filter {
            if net ~ OWNNETSETv6 then accept;
            if source = RTS_STATIC then accept;
            reject;
        };
    };
    include "/etc/bird/ospf/*.conf";
}

#
# iBGP template - internal full mesh
#

template bgp ibgp_peers {
    local as OWNAS;
    path metric 1;

    ipv4 {
        next hop self;
        import filter {
            if bgp_path.last = OWNAS then reject;
            if source ~ [RTS_STATIC, RTS_BGP] then accept;
            reject;
        };
        export filter {
            if source ~ [RTS_STATIC, RTS_BGP] then accept;
            reject;
        };
        import limit 9000 action block;
    };

    ipv6 {
        next hop self;
        import filter {
            if bgp_path.last = OWNAS then reject;
            if source ~ [RTS_STATIC, RTS_BGP] then accept;
            reject;
        };
        export filter {
            if source ~ [RTS_STATIC, RTS_BGP] then accept;
            reject;
        };
        import limit 9000 action block;
    };
}

# Example iBGP peers (duplicate for each internal node)
# protocol bgp ibgp_node2_v4 from ibgp_peers {
#     neighbor 172.20.x.2 as OWNAS;
# }
# protocol bgp ibgp_node2_v6 from ibgp_peers {
#     neighbor fdxx:xxxx:xxxx::2 as OWNAS;
# }

#
# BGP Community filters (for eBGP)
#

function update_latency(int link_latency) {
    bgp_community.add((64511, link_latency));
    if    (64511, 9) ~ bgp_community then { bgp_community.delete([(64511, 1..8)]); return 9; }
    else if (64511, 8) ~ bgp_community then { bgp_community.delete([(64511, 1..7)]); return 8; }
    else if (64511, 7) ~ bgp_community then { bgp_community.delete([(64511, 1..6)]); return 7; }
    else if (64511, 6) ~ bgp_community then { bgp_community.delete([(64511, 1..5)]); return 6; }
    else if (64511, 5) ~ bgp_community then { bgp_community.delete([(64511, 1..4)]); return 5; }
    else if (64511, 4) ~ bgp_community then { bgp_community.delete([(64511, 1..3)]); return 4; }
    else if (64511, 3) ~ bgp_community then { bgp_community.delete([(64511, 1..2)]); return 3; }
    else if (64511, 2) ~ bgp_community then { bgp_community.delete([(64511, 1)]);   return 2; }
    else { bgp_community.delete([(64511, 1)]); return 1; }
}

function update_bandwidth(int link_bandwidth) {
    bgp_community.add((64511, link_bandwidth));
    if    (64511, 21) ~ bgp_community then { bgp_community.delete([(64511, 22..25)]); return 21; }
    else if (64511, 22) ~ bgp_community then { bgp_community.delete([(64511, 23..25)]); return 22; }
    else if (64511, 23) ~ bgp_community then { bgp_community.delete([(64511, 24..25)]); return 23; }
    else if (64511, 24) ~ bgp_community then { bgp_community.delete([(64511, 25..25)]); return 24; }
    else { bgp_community.delete([(64511, 25..25)]); return 25; }
}

function update_crypto(int link_crypto) {
    bgp_community.add((64511, link_crypto));
    if    (64511, 31) ~ bgp_community then { bgp_community.delete([(64511, 32..34)]); return 31; }
    else if (64511, 32) ~ bgp_community then { bgp_community.delete([(64511, 33..34)]); return 32; }
    else if (64511, 33) ~ bgp_community then { bgp_community.delete([(64511, 34..34)]); return 33; }
    else { bgp_community.delete([(64511, 34..34)]); return 34; }
}

function update_flags(int latency; int bandwidth; int crypto) {
    update_latency(latency);
    update_bandwidth(bandwidth);
    update_crypto(crypto);
}

function dn42_import_filter(int latency; int bandwidth; int crypto) -> bool {
    if is_valid_network() && !is_self_net() then {
        if (roa_check(dn42_roa, net, bgp_path.last) != ROA_VALID) then {
            print "[dn42] ROA check failed for ", net, " ASN ", bgp_path.last;
            reject;
        }
        update_flags(latency, bandwidth, crypto);
        accept;
    }
    reject;
}

function dn42_import_filter_v6(int latency; int bandwidth; int crypto) -> bool {
    if is_valid_network_v6() && !is_self_net_v6() then {
        if (roa_check(dn42_roa_v6, net, bgp_path.last) != ROA_VALID) then {
            print "[dn42] ROA check failed for ", net, " ASN ", bgp_path.last;
            reject;
        }
        update_flags(latency, bandwidth, crypto);
        accept;
    }
    reject;
}

function dn42_export_filter(int latency; int bandwidth; int crypto) -> bool {
    if is_valid_network() && source ~ [RTS_STATIC, RTS_BGP] then {
        if source = RTS_STATIC then bgp_community.add((64511, DN42_REGION));
        update_flags(latency, bandwidth, crypto);
        accept;
    }
    reject;
}

function dn42_export_filter_v6(int latency; int bandwidth; int crypto) -> bool {
    if is_valid_network_v6() && source ~ [RTS_STATIC, RTS_BGP] then {
        if source = RTS_STATIC then bgp_community.add((64511, DN42_REGION));
        update_flags(latency, bandwidth, crypto);
        accept;
    }
    reject;
}

#
# eBGP peer template
#

template bgp dnpeers {
    local as OWNAS;
    path metric 1;

    ipv4 {
        import filter {
            if dn42_import_filter(3, 24, 33) then accept; else reject;
        };
        export filter {
            if dn42_export_filter(3, 24, 33) then accept; else reject;
        };
        import limit 9000 action block;
        import table;
    };

    ipv6 {
        import filter {
            if dn42_import_filter_v6(3, 24, 33) then accept; else reject;
        };
        export filter {
            if dn42_export_filter_v6(3, 24, 33) then accept; else reject;
        };
        import limit 9000 action block;
        import table;
    };
}

template bgp dnpeers_v4 from dnpeers {
    ipv6 { import none; export none; };
}

template bgp dnpeers_v6 from dnpeers {
    ipv4 { import none; export none; };
}

#
# Load external peer configs
#

include "/etc/bird/peers/*";
